#:schema https://developers.openai.com/codex/config-schema.json

# Repo-local Codex baseline. External MCPs are intentionally not configured
# here; keep credentials and reviewed third-party integrations in user config.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, RTL behavior, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies Astro, EmDash, and dependency APIs."
config_file = "agents/docs-researcher.toml"
